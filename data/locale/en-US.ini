Capture behavior notice="Game Capture + DXGI keeps OBS Game Capture active while the selected application is unfocused and for 500 ms after it gains focus. DXGI takes over when its first frame is ready. Focus changes are event-driven. Full-monitor DXGI is used only when the selected window exactly covers its monitor; otherwise Game Capture remains active. DXGI submits acquired frames without an OBS-output-FPS limiter, but OBS settings still limit encoded and streamed output, and DXGI captures composed display updates rather than individual game presents. Foreground DXGI reuses one staging texture for CPU readback. Window and Display uses a cropped monitor capture while the app is foreground. The hotkey cycles through all three capture methods. The optional desktop-only capture-method overlay is off by default and can be toggled from Properties or its hotkey. Audio is captured separately from the selected process tree."
