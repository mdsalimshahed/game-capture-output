Capture behavior notice="Window and DXGI captures only the selected window with Windows Graphics Capture while it is unfocused or before it has remained focused for 500 ms. After that, it switches to a cropped DXGI capture of the foreground monitor; other windows can cover the game, and NVIDIA Overlay capture is not guaranteed. If DXGI is unsupported, selected-window capture remains active. Window and Display uses a cropped monitor capture while the app is foreground. Game Capture uses OBS's in-process hook. The hotkey cycles through all capture methods. Audio is captured separately from the selected process tree."
