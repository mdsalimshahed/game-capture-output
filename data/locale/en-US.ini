Capture behavior notice="Game Capture + DXGI activates OBS Game Capture only while the selected application is unfocused, and hides it while focused to avoid running both capture methods at once. Focus changes are event-driven. Full-monitor DXGI is used only when the selected window exactly covers its monitor; otherwise DXGI is disabled to prevent desktop capture. DXGI submits every newly acquired frame without limiting capture to OBS's output rate, so the source can deliver more fresh frames than OBS encodes or streams. DXGI captures composed desktop updates, not individual game presents, so its fresh-frame rate may still be lower than the game's. DXGI requires CPU frame readback while active. Window and Display uses a cropped monitor capture while the app is foreground. The hotkey cycles through all three capture methods. Audio is captured separately from the selected process tree."
